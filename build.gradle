// Plugins/repositories resolve from settings.gradle (pluginManagement +
// dependencyResolutionManagement) so this module builds BOTH standalone (the
// JitPack release) and as a source subproject of the Nexus app — in the latter
// the app's root settings supply the plugins and this settings.gradle is ignored.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'maven-publish'
}

group = "com.github.Tripian-inc"
version = "nexus-1.0.0"

android {
    namespace 'com.tripian.trpcore'
    compileSdk = 35
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        android.buildFeatures.buildConfig true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        // nexus branch: aligned to 21 — the Nexus root forces Kotlin jvmTarget 21
        // for all subprojects, so Java must match to avoid JVM-target mismatch.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'

        // nexus branch: allow the Kotlin 1.9.22 compiler to read dependencies
        // published with newer Kotlin metadata (e.g. Places 5.0.0 → 2.1.0).
        freeCompilerArgs = ['-Xjvm-default=all', '-Xskip-metadata-version-check']
    }
    composeOptions {
        // Legacy Compose Compiler compatible with Kotlin 1.9.22 (nexus branch).
        kotlinCompilerExtensionVersion '1.5.8'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }


    buildTypes {
        debug {
            // Tripian
            buildConfigField("String", "BASE_TRIPIAN_URL", "\"https://gyssxjfp9d.execute-api.eu-west-1.amazonaws.com\"")
            buildConfigField("String", "BASE_API_VERSION", "\"dev/\"")
        }

        release {
            // Tripian
            buildConfigField("String", "BASE_TRIPIAN_URL", "\"https://gyssxjfp9d.execute-api.eu-west-1.amazonaws.com\"")
            buildConfigField("String", "BASE_API_VERSION", "\"prod/\"")
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Force Kotlin stdlib version to match compiler version
// This ensures all Kotlin dependencies use the same version as the compiler
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlin_version"
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Support
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation 'androidx.cardview:cardview:1.0.0'

    // Dagger
    implementation 'com.google.dagger:dagger:2.51.1'
    implementation 'com.google.dagger:dagger-android-support:2.51.1'
    kapt 'com.google.dagger:dagger-compiler:2.51.1'
    kapt 'com.google.dagger:dagger-android-processor:2.51.1'

    // Network
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Lifecycle components (AndroidX). viewModelScope lives in
    // lifecycle-viewmodel-ktx; collectAsState etc. in lifecycle-runtime-ktx.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    // Material components
    implementation 'com.google.android.material:material:1.9.0'
    implementation "androidx.preference:preference-ktx:1.1.1"

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // FlexboxLayout
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
//    kapt 'com.github.bumptech.glide:compiler:4.11.0'

    // Lottie - Loading animations
    implementation 'com.airbnb.android:lottie:6.6.0'

    // Shimmer - Skeleton loading effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Alerter
    implementation 'com.github.tapadoo:alerter:7.2.4'

    // Sdp
    implementation 'com.intuit.sdp:sdp-android:1.0.6'

    // TRPOne — primary REST client.
    implementation 'com.github.Tripian-inc:TRPOne-Android:1.4.9'

    // TRPFoundation — base utilities (extensions, helpers).
    implementation 'com.github.Tripian-inc:TRPFoundation-Android:1.0.0'

    // Civitatis slim build: TRPProviderKit, TRPAuth, and TRPGyg were retired
    // along with the legacy Trip-Mode UI in this branch. Do not add them
    // back here without re-introducing their consumer code first.
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation "com.google.firebase:firebase-messaging-ktx"

    // Coroutines
    // nexus branch: 1.8.1 is the last coroutines line compiled with Kotlin 1.9
    // metadata, readable by the Kotlin 1.9.22 compiler (1.10.x emits 2.1 metadata).
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    // Swipe Refresh
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Google Places
    implementation 'com.google.android.libraries.places:places:5.0.0'

    // Indicator
//    implementation 'com.romandanylyk:pageindicatorview:1.0.3'

    // ChromeTabs
    implementation "androidx.browser:browser:1.4.0"

    // MapBox
    implementation 'com.mapbox.maps:android-ndk27:11.16.0'
    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-services:7.8.0'
    implementation 'com.mapbox.mapboxsdk:mapbox-sdk-turf:7.8.0'

//    implementation 'com.huawei.agconnect:agconnect-core:1.6.3.300'
//    implementation 'com.huawei.hms:push:6.3.0.304'
//    implementation 'com.huawei.agconnect:agconnect-appmessaging:1.6.3.300'
//    implementation 'com.huawei.hms:maps:6.3.0.302'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = project.group
                artifactId = 'TRPCore-Android'
                version = project.version
            }
        }
    }
}